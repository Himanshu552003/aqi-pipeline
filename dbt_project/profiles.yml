# profiles.yml - how dbt connects to each database. NO secrets here: everything comes from env vars.
# The default target follows DB_TYPE; override with --target postgres | --target snowflake.
# Run dbt through ../run_dbt.py so the env vars from ../.env are loaded for you.
aqi_pipeline:
  target: "{{ env_var('DB_TYPE', 'postgres') }}"
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', '') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '') }}"
      dbname: "{{ env_var('POSTGRES_DB', '') }}"
      schema: public
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', '') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', '') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', '') }}"
      schema: PUBLIC
      threads: 4
