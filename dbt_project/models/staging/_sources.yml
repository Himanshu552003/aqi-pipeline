version: 2

sources:
  - name: raw
    description: Raw layer loaded by scraper/load.py (one row per station x pollutant x reading time).
    schema: raw
    tables:
      - name: aqi_readings
        description: CPCB real-time pollutant sub-indices from the data.gov.in API.
        config:
          loaded_at_field: loaded_at_utc
          freshness:                       # `dbt source freshness` warns / fails if the loader stops
            warn_after: {count: 3, period: hour}
            error_after: {count: 12, period: hour}
