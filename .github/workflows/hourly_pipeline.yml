# hourly_pipeline.yml - every hour: unit tests -> scrape + clean + load -> dbt build (models + data tests)
# Credentials come from GitHub Secrets (repo Settings -> Secrets and variables -> Actions).
#
# Runs on a SELF-HOSTED runner (a Windows PC in India), not on GitHub's cloud machines:
# the data.gov.in API refuses connections from GitHub's cloud runners (ConnectTimeout on every
# attempt, while the same API answers from an Indian connection at the same time).
name: Hourly AQI pipeline

on:
  schedule:
    - cron: "17 * * * *"      # minute 17 of every hour (UTC). If the PC is off, one run waits in the queue
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

concurrency:
  group: aqi-pipeline         # never run two pipelines at the same time
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"         # Windows console: avoid encoding errors in logs
      DB_TYPE: postgres
      LOAD_TARGETS: ${{ vars.LOAD_TARGETS || 'postgres' }}   # set the repo variable to "postgres,snowflake" for dual-load
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_SSLMODE: require
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: RAW

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # The virtual environment lives outside the checkout folder, so it survives between runs
      # and packages are only downloaded once (later runs just confirm they are installed).
      - name: Set up Python environment
        run: |
          $venv = Join-Path $HOME ".venvs\aqi-pipeline"
          if (-not (Test-Path "$venv\Scripts\python.exe")) { python -m venv $venv }
          & "$venv\Scripts\python.exe" -m pip install --quiet --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$venv\Scripts`n")

      - name: Unit tests
        run: python -m pytest -q

      - name: Extract + load (scrape -> clean -> load)
        run: python -m scraper.pipeline

      - name: Transform + test with dbt (Postgres)
        run: python run_dbt.py build --target postgres

      - name: Transform + test with dbt (Snowflake)
        if: contains(env.LOAD_TARGETS, 'snowflake')
        run: python run_dbt.py build --target snowflake

      - name: Check source freshness
        run: python run_dbt.py source freshness --target postgres
